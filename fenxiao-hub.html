<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>分销工作台中枢</title>
<style>
  :root{
    --primary:#245eea; --primary-100:#dbeafe; --primary-soft:#eff4ff;
    --text:#17243a; --muted:#64748b; --muted2:#94a3b8;
    --border:#dbe4f0; --border-strong:#cbd5e1; --surface:#ffffff; --bg:#f1f5f9;
    --radius:14px; --radius-md:9px; --radius-sm:6px;
    --shadow-card:0 7px 24px rgba(40,111,216,.07);
    --shadow-hover:0 14px 34px rgba(40,111,216,.16);
    --l0:#94a3b8; --l1:#245eea; --l2:#0d9488; --l3:#d97706; --l4:#16a34a;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    font-size:13px;min-height:100vh;display:flex;flex-direction:column;
  }

  /* 顶栏 */
  .topbar{
    height:60px;display:flex;align-items:center;justify-content:space-between;
    padding:0 22px;background:var(--surface);border-bottom:1px solid var(--border);
    flex-shrink:0;position:sticky;top:0;z-index:20;
  }
  .brand{display:flex;align-items:center;gap:11px}
  .logo{
    width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#245eea,#7c3aed);color:#fff;font-weight:700;font-size:15px;
    box-shadow:0 4px 12px rgba(36,94,234,.35);
  }
  .brand h1{font-size:15.5px;font-weight:650;letter-spacing:.2px}
  .brand .sub{font-size:11.5px;color:var(--muted);margin-top:1px}
  .stats{display:flex;gap:10px}
  .stat{
    background:var(--primary-soft);border:1px solid var(--border);border-radius:var(--radius-md);
    padding:6px 14px;text-align:center;min-width:78px;
  }
  .stat b{display:block;font-size:17px;font-weight:700;color:var(--primary);
    font-variant-numeric:tabular-nums;line-height:1.15}
  .stat span{font-size:11px;color:var(--muted)}
  .stat.warn b{color:#d97706} .stat.ok b{color:#16a34a}

  /* 主体 */
  .main{flex:1;display:flex;min-height:0}

  /* 侧栏 */
  .sidebar{
    width:284px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);
    padding:16px 14px;overflow-y:auto;
  }
  .side-title{font-size:11px;font-weight:600;letter-spacing:1.5px;color:var(--muted2);
    text-transform:uppercase;margin:2px 4px 12px}
  .seg{
    border:1px solid var(--border);border-radius:var(--radius);
    background:var(--surface);padding:13px 14px;margin-bottom:11px;cursor:pointer;
    transition:.18s;position:relative;overflow:hidden;
  }
  .seg::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
  .seg:hover{border-color:var(--border-strong);box-shadow:var(--shadow-card);transform:translateY(-1px)}
  .seg.on{border-color:var(--c);box-shadow:0 0 0 1px var(--c) inset,var(--shadow-hover);
    background:linear-gradient(180deg,var(--bg),var(--surface))}
  .seg .r1{display:flex;align-items:center;gap:8px;margin-bottom:5px}
  .seg .seq{
    width:21px;height:21px;border-radius:50%;flex-shrink:0;font-size:12px;font-weight:600;
    display:flex;align-items:center;justify-content:center;
    color:var(--c);background:color-mix(in srgb,var(--c) 10%,#fff);border:1px solid var(--c);
  }
  .seg .nm{font-size:13.5px;font-weight:650}
  .seg .cnt{margin-left:auto;font-size:10.5px;font-weight:600;color:var(--c);
    background:color-mix(in srgb,var(--c) 10%,#fff);border-radius:999px;padding:2px 8px}
  .seg .ds{font-size:11.5px;color:var(--muted);line-height:1.5;margin-bottom:8px}
  .seg .lr{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--muted)}
  .badge{display:inline-flex;align-items:center;gap:4px;border-radius:var(--radius-sm);
    padding:1px 7px;font-size:10.5px;font-weight:650;border:1px solid transparent}
  .dot{width:6px;height:6px;border-radius:50%;display:inline-block}

  /* 右面板 */
  .panel{flex:1;min-width:0;overflow-y:auto;padding:18px 24px 44px}

  .crumb{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);margin-bottom:14px}
  .crumb .cchip{background:var(--surface);border:1px solid var(--border);border-radius:999px;
    padding:3px 11px;display:inline-flex;align-items:center;gap:5px}
  .crumb .cchip b{color:var(--text);font-weight:600}
  .crumb .cchip.on{border-color:var(--c);color:var(--c);
    background:color-mix(in srgb,var(--c) 7%,#fff)}

  .phead{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow-card);padding:16px 18px;margin-bottom:16px;
    display:flex;align-items:center;gap:16px;position:relative;overflow:hidden;
  }
  .phead::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
  .phead .pt{font-size:16.5px;font-weight:700}
  .phead .pd{font-size:12px;color:var(--muted);margin-top:4px}
  .phead .pr{margin-left:auto;display:flex;gap:26px;text-align:right}
  .phead .pr .s b{font-size:15px;font-weight:700;color:var(--c);display:block}
  .phead .pr .s span{font-size:11px;color:var(--muted)}

  .handoff{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:16px}
  .hchip{font-size:11.5px;color:var(--muted);border:1px dashed var(--border-strong);
    border-radius:var(--radius-md);padding:6px 12px;background:var(--surface)}
  .hchip b{color:var(--text);font-weight:600}
  .hchip.rel{border-style:solid;border-color:var(--c);background:color-mix(in srgb,var(--c) 6%,#fff);color:var(--text)}

  .nodes{display:grid;grid-template-columns:repeat(auto-fill,minmax(370px,1fr));gap:14px}
  .node{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow-card);overflow:hidden;transition:.18s;display:flex;flex-direction:column;
  }
  .node:hover{box-shadow:var(--shadow-hover);transform:translateY(-2px);border-color:var(--border-strong)}
  .node .nh{display:flex;align-items:center;gap:10px;padding:13px 15px;
    border-bottom:1px solid var(--border);background:var(--primary-soft)}
  .node .code{font-size:10.5px;font-weight:700;color:#fff;background:var(--c);
    border-radius:var(--radius-sm);padding:2px 8px;letter-spacing:.4px}
  .node .nn{font-size:13.5px;font-weight:650}
  .node .nlv{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--muted2)}
  .node .nb{padding:13px 15px;display:flex;flex-direction:column;gap:11px}
  .fld .k{font-size:10.5px;font-weight:600;letter-spacing:.5px;color:var(--muted2);margin-bottom:5px}
  .fld .v{font-size:12.5px;color:var(--text);line-height:1.6}
  .oplist{display:flex;flex-direction:column;gap:6px}
  .op{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;color:var(--text);
    line-height:1.5;padding:7px 11px;border-radius:var(--radius-md);
    background:var(--bg);border-left:2.5px solid var(--c)}
  .op i{font-style:normal;font-weight:700;color:var(--c);flex-shrink:0;font-size:11px}
  .pain{font-size:11.5px;line-height:1.55;color:#92400e;background:#fffbeb;
    border:1px solid #fde68a;border-radius:var(--radius-md);padding:8px 11px}

  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:6px}
  ::-webkit-scrollbar-thumb:hover{background:#94a3b8}

  @media(max-width:900px){
    .main{flex-direction:column}
    .sidebar{width:100%;border-right:none;border-bottom:1px solid var(--border);
      display:flex;gap:10px;overflow-x:auto;padding:12px}
    .seg{min-width:232px;margin-bottom:0}
    .side-title{display:none}
    .nodes{grid-template-columns:1fr}
    .stats{display:none}
  }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <div class="logo">分</div>
      <div>
        <h1>分销工作台中枢</h1>
        <div class="sub">电商发展部 · 线上分销经营 · 3 大聚合板块</div>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><b>3</b><span>业务板块</span></div>
      <div class="stat"><b>7</b><span>分支节点</span></div>
      <div class="stat ok"><b>5</b><span>正常运行</span></div>
      <div class="stat warn"><b>2</b><span>待优化</span></div>
    </div>
  </div>

  <div class="main">
    <aside class="sidebar">
      <div class="side-title">业务板块</div>
      <div id="segbox"></div>
    </aside>
    <section class="panel">
      <div class="crumb" id="crumb"></div>
      <div class="phead" id="phead"></div>
      <div class="handoff" id="handoff"></div>
      <div class="nodes" id="nodes"></div>
    </section>
  </div>

<script>
const SEGMENTS = [{"id": "C", "seq": "①", "name": "合同审核类", "color": "#245eea", "desc": "选品报价与合同条款审核，输出可执行的合作依据。", "lv": "L1", "target": "L3", "nodes": [{"code": "F1", "name": "选品报价与控价校验", "actor": "分销负责人 / 商品", "lv": "L1", "target": "L3", "type": "中枢🟡 + 人工👤", "input": "供货折扣、活动政策、成本、控价红线", "ops": ["生成选品报价单", "核算毛利与控价红线", "维护折扣/成本/红线参数", "提交至 F2 合同环节"], "output": "报价清单、政策与控价线", "pain": "毛利校验与自动报价尚未成型，当前以人工 + 表格为主"}, {"code": "F2", "name": "合作条款与法务审核", "actor": "分销商务 / 法务", "lv": "L1", "target": "L3", "type": "人工👤 + 文档/审批", "input": "报价、模板、保证金、控价约定", "ops": ["套用合同模板起草", "条款差异比对", "法务审核与补充协议", "协议版本留痕归档"], "output": "已审批合同、协议版本", "pain": "差异比对与版本留痕仍靠人工文档审批"}]}, {"id": "P", "seq": "②", "name": "履约执行类", "color": "#7c3aed", "desc": "资质授权、店铺机制、采购物流的落地执行。", "lv": "L1", "target": "L3", "nodes": [{"code": "F3", "name": "资质授权与材料交付", "actor": "分销商务 / 品牌", "lv": "L0", "target": "L2", "type": "人工👤 / 缺失🈳", "input": "主体、营业执照、授权书、商标证", "ops": ["调取主体资质材料", "生成授权书", "交付合作方并留档", "资质到期提醒"], "output": "完整资质包、授权凭证", "pain": "资质/授权靠人工邮件，未形成在线闭环与到期提醒"}, {"code": "F4", "name": "店铺机制与价格管理", "actor": "分销运营 / 合作方", "lv": "L1", "target": "L3", "type": "外部🔶 + 人工👤", "input": "合同、商品资料、客服规则", "ops": ["店铺机制审核", "价格稽查与巡店", "物料/话术培训", "破价预警处置"], "output": "可运营店铺、价格与内容规范", "pain": "内部价格巡检与异常回流未打通，破价预警缺失"}, {"code": "F5", "name": "采购出货与物流跟踪", "actor": "分销运营 / 仓储", "lv": "L0", "target": "L2", "type": "ERP/表格 + 人工👤", "input": "采购单、库存、物流方案", "ops": ["采购录单", "分配库存", "计算运费与发货", "物流追踪与签收回传"], "output": "出库单、物流状态、签收结果", "pain": "订单/库存/物流状态未自动同步，缺异常预警"}]}, {"id": "S", "seq": "③", "name": "财务对账类", "color": "#db2777", "desc": "回款对账、发票核销与售后舆情闭环。", "lv": "L0", "target": "L2", "nodes": [{"code": "F6", "name": "财务对账与发票结算", "actor": "分销运营 / 财务", "lv": "L0", "target": "L3", "type": "人工👤 / 缺失🈳", "input": "回款、出货、物流、政策、发票", "ops": ["账单勾稽核对", "政策核销", "开具发票", "对账差异分级"], "output": "对账差异、核销结果、发票", "pain": "账单勾稽与发票仍以人工为主，是关键 L0"}, {"code": "F7", "name": "售后处理与舆情监控", "actor": "分销运营 / 客服", "lv": "L0", "target": "L2", "type": "人工👤 / 缺失🈳", "input": "退货、漏发、投诉与舆情", "ops": ["售后工单登记", "规则分流派单", "舆情监控与摘要", "升级处理与复盘回流"], "output": "售后结论、责任与改进项", "pain": "售后与舆情处置依赖人工，未工单化，缺规则分流与升级闭环"}]}];
const HANDOFFS = [["合同审核类", "履约执行类", "合同生效 → 材料交付"], ["履约执行类", "财务对账类", "发货完成 → 对账确认"], ["财务对账类", "合同审核类", "复盘回流 → 报价确认"]];
const LVC = {"L0": "#94a3b8", "L1": "#245eea", "L2": "#0d9488", "L3": "#d97706", "L4": "#16a34a"};
let cur = 0;

function lvBadge(lv){
  const c = LVC[lv] || '#94a3b8';
  return `<span class="badge" style="color:${c};border-color:${c};background:${c}14">
    <span class="dot" style="background:${c}"></span>${lv}</span>`;
}

function renderSidebar(){
  document.getElementById('segbox').innerHTML = SEGMENTS.map((s,i)=>`
    <div class="seg ${i===cur?'on':''}" style="--c:${s.color}" onclick="select(${i})">
      <div class="r1">
        <span class="seq">${s.seq}</span>
        <span class="nm">${s.name}</span>
        <span class="cnt">${s.nodes.length} 项</span>
      </div>
      <div class="ds">${s.desc}</div>
      <div class="lr">${lvBadge(s.lv)} <span>→</span> ${lvBadge(s.target)}</div>
    </div>`).join('');
}

function renderPanel(){
  const s = SEGMENTS[cur];
  const phead = document.getElementById('phead');
  phead.style.setProperty('--c', s.color);

  document.getElementById('crumb').innerHTML =
    '<span>模块工作流程</span>' + SEGMENTS.map((x,i)=>
      `<span>›</span><span class="cchip ${i===cur?'on':''}" style="--c:${x.color}">
        ${x.seq} <b>${x.name}</b></span>`).join('');

  phead.innerHTML = `
    <div>
      <div class="pt">${s.seq} ${s.name}</div>
      <div class="pd">${s.desc}</div>
    </div>
    <div class="pr">
      <div class="s"><b>${s.nodes.length}</b><span>分支节点</span></div>
      <div class="s"><b>${s.lv} → ${s.target}</b><span>当前 → 目标</span></div>
    </div>`;

  document.getElementById('handoff').innerHTML = HANDOFFS.map(h=>{
    const rel = h[0]===s.name || h[1]===s.name;
    return `<div class="hchip ${rel?'rel':''}" style="${rel?'--c:'+s.color:''}">
      <b>${h[0]}</b> → <b>${h[1]}</b> · ${h[2]}</div>`;
  }).join('');

  document.getElementById('nodes').innerHTML = s.nodes.map(n=>`
    <div class="node" style="--c:${s.color}">
      <div class="nh">
        <span class="code">${n.code}</span>
        <span class="nn">${n.name}</span>
        <span class="nlv">${lvBadge(n.lv)}→${lvBadge(n.target)}</span>
      </div>
      <div class="nb">
        <div class="fld"><div class="k">👤 执行者 / 载体</div><div class="v">${n.actor} · ${n.type}</div></div>
        <div class="fld"><div class="k">📥 输入</div><div class="v">${n.input}</div></div>
        <div class="fld">
          <div class="k">🛠️ 操作内容</div>
          <div class="oplist">${n.ops.map((o,i)=>`<div class="op"><i>${i+1}</i><span>${o}</span></div>`).join('')}</div>
        </div>
        <div class="fld"><div class="k">📤 输出</div><div class="v">${n.output}</div></div>
        <div class="pain">⚠ 当前痛点：${n.pain}</div>
      </div>
    </div>`).join('');
}

function select(i){
  cur = i; renderSidebar(); renderPanel();
  document.querySelector('.panel').scrollTop = 0;
}

renderSidebar(); renderPanel();
</script>
</body>
</html>
